# issue を開く前の選択画面。
#
# blank_issues_enabled は true のままにする。SECURITY.md が「Security タブが
# 使えない場合は issue に連絡先だけ書いてください」と案内しているので、空の
# issue を塞ぐとその代替手段と矛盾する。テンプレートは「うまく動かない」1つだけで、
# 質問や提案はそこに当てはまらない。
blank_issues_enabled: true

contact_links:
  - name: 脆弱性の報告(非公開)
    url: https://github.com/eoforgu0/padcue/security/advisories/new
    about: >-
      詳細を公開の issue に書かないでください。何を報告してほしいか・
      何を仕様として認めているかは SECURITY.md にあります。
