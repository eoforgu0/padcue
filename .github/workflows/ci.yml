name: CI

# 読むだけで足りる。既定に任せると、リポジトリの設定しだいで書き込み権限を
# 持った GITHUB_TOKEN が公開リポジトリの pull_request(fork からも走る)に
# 渡りうる
permissions:
  contents: read

# 対象は Windows。バッチ(padcue.bat)から起動する道具なので、画面まわりの
# 検査はその Windows で回す。パッケージ本体は標準ライブラリだけで書かれていて
# OS に依存しないため、こちらは速い ubuntu で回す(Python 版のマトリクスは
# 組まない。宣言している最小版で通れば、それ以降の版でも同じ結果になる)。
on:
  # push は main だけ。タグは main のコミットを指すので、押すと同じ内容の
  # 実行がもう1本増える。ブランチは pull_request 側が拾う(自分の repo の
  # ブランチから PR を出すと push と pull_request で二重に走るのも、これで止まる)
  push:
    branches: [main]
  pull_request:

jobs:
  pc:
    name: PC 側(検査と lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pyproject が宣言している最小版で検証する(最新版は手元で通している)
          python-version: "3.10"

      # README と CONTRIBUTING が最初に案内する手順そのものを回す。
      # ここを通さないと、パッケージの宣言が壊れていても検査は緑のままになる
      # (readme に外のパスを書いていて install が必ず失敗する状態が実在した)
      - name: 開発用の依存を入れる(README と同じ手順)
        run: pip install -e "./pctool[dev]"

      - name: コマンドが入口から動く
        run: padcue --help

      - name: lint
        run: ruff check pctool

      - name: 検査
        # runner には gcc が入っている。C 実装と Python 参照実装の送出列一致は
        # このプロジェクトの中核的な主張なので、gcc が無いときに
        # skip されないよう要求フラグを立てる(手元の Windows では skip 可)。
        env:
          PADCUE_REQUIRE_GCC: "1"
        run: python -m pytest -q

  ui:
    name: 画面(ブラウザで実操作)
    # 利用者が実際に動かすのは Windows。画面の資産は 5,800 行あり、pytest 側は
    # 定数表の突き合わせしか見ていない。ここが唯一「押したらどうなるか」を
    # 見る場所なので、対象の OS でそのまま回す。
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ブラウザは playwright が用意する(Windows なので OS 側の追加は不要)。
      # 依存は pc ジョブと同じく CONTRIBUTING の手順で入れる
      # 1ステップに並べない。pwsh は**最後のコマンドの終了コードだけ**を見るので、
      # pip が失敗しても playwright が成功すればステップは緑になり、次の検査が
      # 理由の分からない import エラーで落ちる
      - name: 画面検査の依存を入れる
        run: pip install -e "./pctool[dev]"

      - name: ブラウザを入れる
        run: playwright install chromium

      # 実機に触れないよう、道具の側で探索先を模擬デバイスに固定している
      # (tools/_localonly.py)。CI には実機が無いので二重に安全。
      - name: 操作画面の検査(134 項目)
        run: python pctool/tools/uicheck.py uicheck-out

      - name: 手順書どおりの通し確認
        run: python pctool/tools/runbook_walk.py runbook-walk-out

      # 失敗した項目はスクリーンショットが残る。CI のログだけでは
      # 「何がどう違ったか」が分からないので持ち帰れるようにする
      - name: 失敗時の画面を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uicheck-screenshots
          path: |
            uicheck-out/*.png
            runbook-walk-out/*.png
          if-no-files-found: ignore

  firmware:
    name: ファームウェア(ビルド)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # main/ の約2,000行は、他のどの検査でも守られていない。
      # 「コンパイルが通る」ことの確認だけは代替手段が無いので CI で見る。
      - name: ESP-IDF でビルド
        uses: espressif/esp-idf-ci-action@v1
        with:
          # dependencies.lock が記録している版(idf 5.5.5)と揃える。
          # v5.5 は 5.5.0 のタグで、ずれると component manager が依存を
          # 解決し直すので lock が効かず、lock 自体も書き換わる
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 割り込み経路の関数が1つでもフラッシュに残ると、フラッシュ操作と
      # 重なった瞬間だけ落ちる(実行の数%規模で再現する)。
      # ビルド結果(map)から配置を確かめる。手元では map が無ければ skip
      # されるので、CI では要求フラグを立てる
      - name: 割り込み経路が IRAM に載っていることを確かめる
        env:
          PADCUE_REQUIRE_FIRMWARE: "1"
        run: |
          pip install "pytest>=7.0"
          python -m pytest -q pctool/tests/test_firmware_iram.py
