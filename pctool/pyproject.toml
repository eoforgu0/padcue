[project]
name = "padcue"
version = "0.3.0"
description = "Switch 2 自動操作システムの PC 側ツール"
# readme は指定しない。README はリポジトリ直下(このフォルダの外)にあり、
# setuptools はパッケージのフォルダより外のファイルを読まない
# (`Cannot access ... (or anything outside ...)` で必ず失敗する)。
# 置き場所を変えるより、説明は description と GitHub の README に任せる
license = "Apache-2.0"
requires-python = ">=3.10"

# 実行時の依存はゼロ。標準ライブラリ23モジュールだけで動くことがこのツールの
# 前提で、「Python を入れて padcue.bat をダブルクリックするだけ」を成立させて
# いる。空リストは省略ではなく主張なので、明示したまま保つこと。
dependencies = []

[project.optional-dependencies]
# 開発時だけ必要。pytest は検査、playwright は画面を実際に動かす検査に使う
# (uicheck.py / runbook_walk.py / shoot.py)、ruff は lint。pytest の
# pythonpath 設定は 7.0 以降の機能なので下限に根拠がある。ruff は CI が
# 門番にしている検査なので、手元でも同じものが入るようにしておく。
dev = ["pytest>=7.0", "playwright>=1.40", "ruff>=0.6"]

[project.scripts]
padcue = "padcue.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["padcue"]

# 画面そのもの(HTML / CSS / JS)。pip install したときも同梱する
[tool.setuptools.package-data]
padcue = ["web/*"]

# pytest の設定はリポジトリ直下の pytest.ini が正本(pythonpath も
# norecursedirs も、リポジトリルートを基準にしないと書けないため)。
# ここに書くと `cd pctool` で叩いたときだけ別条件になる。

[tool.ruff]
line-length = 88
extend-exclude = ["build"]

[tool.ruff.lint]
# preview を開けるのは、pycodestyle の空白・空行の規則(E1xx / E2xx / E3xx)が
# ruff ではまだ preview 扱いだから。"E" を選んでいても動かないので、空行が
# 2つでも4つでも lint は緑のままになる。
# explicit-preview-rules = true と対で使い、**番号で指名したものだけ**を
# 有効にする。開けっ放しにすると ruff を上げるたびに未知の規則が増えて、
# コードに触っていない日に CI が赤くなる。
preview = true
explicit-preview-rules = true

# BLE(握り潰しの検出)は必ず含める。既存の `# noqa: BLE001` は意図して
# 置いた注釈で、外すと RUF100(不要な noqa)で一斉に消される。
select = [
    "E", "F", "W", "I", "B", "BLE", "UP", "RUF",
    # 空行の数(定義の前後・入れ子の定義の前)。接頭辞 "E3" では preview の
    # 規則は起きないので、6つとも番号で書く
    "E301", "E302", "E303", "E304", "E305", "E306",
    # 桁まわり: コメントのぶら下げ / カンマの後の空白 / 行末コメントの前の空白
    "E116", "E231", "E261",
]

ignore = [
    # 日本語のコメント・文字列・docstring に全角記号を使うのは正当。
    # この3つは「× と x」「＋ と +」のような見た目の紛らわしさを見る規則で、
    # 英語圏のコードを前提にしていて、日本語主体のこのコードでは全件が
    # 誤検知になる。なお図の桁が崩れる問題(曖昧幅)とは別物で、そちらは
    # 文書側で ASCII に統一してある。
    "RUF001",
    "RUF002",
    "RUF003",
]
